name: Update detectable applications

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-detectable
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build detectable.json
        run: bun run scripts/build.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detectable.json pretty-detectable.json detectable-win32.json detectable-darwin.json
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: update detectable applications ($(date -u +%F))"
            git push
          fi
